<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #FAFAF7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: 44px;
      background: #F5F2EB;
      border-bottom: 1px solid #E0DAD0;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Courier New', monospace;
      font-weight: 700;
      font-size: 1rem;
      color: #C4992A;
      letter-spacing: -0.02em;
    }

    .topbar-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-icon {
      background: none;
      border: 1px solid #DDD8CE;
      border-radius: 5px;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: #666;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-icon:hover { background: #EDE9E0; color: #333; }

    /* ── Context banner ── */
    .context-banner {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: #FFF9EC;
      border-bottom: 1px solid #F0E4C0;
      font-size: 0.72rem;
      color: #7A6020;
      flex-shrink: 0;
    }
    .context-banner.visible { display: flex; }
    .context-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .context-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #C4992A;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .btn-dismiss {
      background: none;
      border: none;
      color: #AAA;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .btn-dismiss:hover { color: #555; }

    /* ── Loading state ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: #888;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #E5E0D8;
      border-top-color: #C4992A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: 'Courier New', monospace;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ── Error state ── */
    .error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }
    .error-state.visible { display: flex; }
    .error-icon { font-size: 2rem; }
    .error-msg { font-size: 0.8rem; color: #666; line-height: 1.5; }
    .error-url { font-family: monospace; font-size: 0.7rem; color: #AAA; word-break: break-all; }
    .btn-retry {
      background: #C4992A;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 7px 16px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-retry:hover { background: #A87E20; }

    /* ── iframe ── */
    iframe {
      flex: 1;
      width: 100%;
      border: none;
      display: none;
    }
    iframe.visible { display: block; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="topbar">
    <span class="logo">📚 Tome</span>
    <div class="topbar-actions">
      <button class="btn-icon" id="btn-refresh" title="Refresh">↻ Refresh</button>
      <button class="btn-icon" id="btn-capture" title="Re-capture page context">⊙ Capture</button>
      <button class="btn-icon" id="btn-open" title="Open in new tab">↗ Expand</button>
    </div>
  </div>

  <!-- Context capture banner -->
  <div class="context-banner" id="context-banner">
    <div class="context-dot"></div>
    <div class="context-text" id="context-text">Capturing page context...</div>
    <button class="btn-dismiss" id="btn-dismiss" title="Dismiss">✕</button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Loading Tome...</div>
  </div>

  <!-- Error -->
  <div class="error-state" id="error-state">
    <div class="error-icon">⚠️</div>
    <div class="error-msg">Could not load Tome. Make sure your Streamlit app is running and the URL is set correctly in <code>background.js</code>.</div>
    <div class="error-url" id="error-url"></div>
    <button class="btn-retry" id="btn-retry">Try Again</button>
  </div>

  <!-- Tome iframe -->
  <iframe id="tome-frame" allow="clipboard-write" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>

  <script>
    const frame = document.getElementById("tome-frame");
    const loading = document.getElementById("loading");
    const errorState = document.getElementById("error-state");
    const errorUrl = document.getElementById("error-url");
    const contextBanner = document.getElementById("context-banner");
    const contextText = document.getElementById("context-text");

    let tomeBaseUrl = "";
    let currentQuery = "";

    // ── Get Tome URL from background ────────────────────────────────────────
    chrome.runtime.sendMessage({ type: "GET_TOME_URL" }, (res) => {
      tomeBaseUrl = res?.url || "";
      loadTome();
    });

    function buildUrl(query) {
      if (!tomeBaseUrl) return "";
      const base = tomeBaseUrl.replace(/\/$/, "");
      if (query) {
        return `${base}?q=${encodeURIComponent(query)}`;
      }
      return base;
    }

    function loadTome(query) {
      const url = buildUrl(query || "");
      if (!url || url.includes("YOUR-APP")) {
        showError(url);
        return;
      }

      loading.style.display = "flex";
      errorState.classList.remove("visible");
      frame.classList.remove("visible");

      frame.src = url;
    }

    function showError(url) {
      loading.style.display = "none";
      frame.classList.remove("visible");
      errorState.classList.add("visible");
      errorUrl.textContent = url || "(URL not set)";
    }

    // ── iframe load events ───────────────────────────────────────────────────
    frame.addEventListener("load", () => {
      loading.style.display = "none";
      frame.classList.add("visible");
      errorState.classList.remove("visible");
    });

    frame.addEventListener("error", () => showError(frame.src));

    // ── Page context from storage ────────────────────────────────────────────
    function checkForContext() {
      chrome.storage.session.get("pageContext", (data) => {
        const ctx = data?.pageContext;
        if (!ctx || !ctx.query) return;

        // Only use context captured in the last 5 seconds (fresh navigation)
        const age = Date.now() - (ctx.timestamp || 0);
        if (age > 5000) return;

        currentQuery = ctx.query;
        showContextBanner(ctx);
        loadTome(currentQuery);

        // Clear so we don't re-use stale context on next open
        chrome.storage.session.remove("pageContext");
      });
    }

    function showContextBanner(ctx) {
      contextText.textContent = `Auto-captured: "${ctx.query.slice(0, 60)}${ctx.query.length > 60 ? '…' : ''}"`;
      contextBanner.classList.add("visible");
    }

    // Run on panel open
    checkForContext();

    // Poll briefly for context (content script may fire slightly after panel opens)
    let pollCount = 0;
    const poll = setInterval(() => {
      pollCount++;
      checkForContext();
      if (pollCount >= 5) clearInterval(poll);
    }, 600);

    // ── Button handlers ──────────────────────────────────────────────────────
    document.getElementById("btn-refresh").addEventListener("click", () => {
      loadTome(currentQuery);
    });

    document.getElementById("btn-capture").addEventListener("click", () => {
      // Ask content script to re-capture current page
      chrome.tabs.query({ active: true, currentWindow: true }, (tabs) => {
        if (!tabs[0]) return;
        chrome.scripting.executeScript({
          target: { tabId: tabs[0].id },
          files: ["content.js"]
        }, () => {
          setTimeout(checkForContext, 800);
        });
      });
    });

    document.getElementById("btn-open").addEventListener("click", () => {
      const url = buildUrl(currentQuery);
      if (url) chrome.tabs.create({ url });
    });

    document.getElementById("btn-dismiss").addEventListener("click", () => {
      contextBanner.classList.remove("visible");
    });

    document.getElementById("btn-retry").addEventListener("click", () => {
      loadTome(currentQuery);
    });
  </script>
</body>
</html>
